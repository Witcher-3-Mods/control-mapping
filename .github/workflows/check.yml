name: Check release build

# Builds and verifies both release ZIPs for every pull request, so a packaging error shows up before
# a merge instead of in the release job. Nothing is published.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test install.cmd and uninstall.cmd against a fake game folder
        # Runs the real scripts the way a double-click does: install, overwrite, install from the game folder, uninstall from
        # inside the mod folder, the controls reset, cancelling, and a folder that is not a game. Fails on the first wrong result.
        timeout-minutes: 5
        run: |
          & ./tools/Test-Witcher3ModsInstallers.ps1
      - name: Package and verify the Automatic release ZIP (with install.cmd and uninstall.cmd)
        run: |
          & ./tools/New-Witcher3ModsReleaseArchive.ps1 -Variant Automatic -OutputPath "$env:RUNNER_TEMP/check-automatic.zip"
      - name: Package and verify the Manual release ZIP (no scripts)
        run: |
          & ./tools/New-Witcher3ModsReleaseArchive.ps1 -Variant Manual -OutputPath "$env:RUNNER_TEMP/check-manual.zip"
